<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=attendance.html">
    <title>ZSSF Event Registration</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #fff;
            background: #0c2417 url('4.jpg') center / cover no-repeat fixed;
        }
        .card {
            width: min(100%, 460px);
            padding: 28px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 20px;
            background: rgba(10,30,20,.82);
            box-shadow: 0 20px 45px rgba(0,0,0,.5);
        }
        h1 { margin: 0 0 10px; color: #ffeb3b; font-size: 1.5rem; }
        p { margin: 0; line-height: 1.6; color: #e0e0e0; }
        a { color: #ffeb3b; font-weight: 700; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Opening Event Registration</h1>
        <p>If the page does not open automatically, <a href="attendance.html">continue to the attendance form</a>.</p>
    </main>
</body>
</html>
